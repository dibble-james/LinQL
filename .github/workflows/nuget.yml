name: Nuget

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Skip the NuGet push and the wiki sync
        type: boolean
        default: false
  push:
    branches: [main]
    tags: "*"
  pull_request:
    branches: [main]

# The wiki sync pushes to <repo>.wiki.git, which needs contents: write.
# Pull requests from forks are downgraded to read-only by GitHub regardless.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The tag name for a tag push (the release version), 1.0.0 otherwise.
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '1.0.0' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # global.json pins the SDK, and that pin is what actually selects it:
          # without one the resolver picks the highest SDK on the runner.
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Run Tests
        run: dotnet test --no-restore

      - name: Pack
        run: dotnet pack --no-restore -c release --include-symbols /p:SymbolPackageFormat=snupkg /p:AssemblyVersion=1.0.0.0 /p:Version=${VERSION}

      # Builds a consumer against the packed artifacts so the generator is
      # exercised from analyzers/dotnet/cs, not from a project reference.
      - name: Smoke test packed analyzers
        run: ./eng/smoke-test-package.sh

      - name: Push
        if: github.ref_type == 'tag' && !inputs.dry_run
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "**/LinQL*.$VERSION.nupkg" -s https://api.nuget.org/v3/index.json -k "$NUGET_API_KEY"

      # Mirrors docs/ to the wiki, rewriting in-source links so they resolve on
      # the wiki too. strategy: clone (the default) adds a commit rather than
      # force-pushing, and the .wiki.git repository only exists once the wiki has
      # at least one page, so this assumes it has been initialised.
      - name: Sync Wiki
        if: github.ref_type == 'tag' && !inputs.dry_run
        uses: Andrew-Chen-Wang/github-wiki-action@v5
        with:
          path: docs
          # No commit on a tag whose docs are unchanged.
          disable-empty-commits: true
