name: Nuget

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Skip the NuGet push and the wiki sync
        type: boolean
        default: false
  push:
    branches: [main]
    tags: "*"
  pull_request:
    branches: [main]

# The wiki sync pushes to <repo>.wiki.git, which needs contents: write.
# Pull requests from forks are downgraded to read-only by GitHub regardless.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The tag name for a tag push (the release version), 1.0.0 otherwise.
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '1.0.0' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Stays on 8.0.x here. Moving to 10.0.x enables a new analyzer set that
          # the codebase is not clean under yet; that move is #39.
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Run Tests
        run: dotnet test --no-restore

      - name: Pack
        run: dotnet pack --no-restore -c release --include-symbols /p:SymbolPackageFormat=snupkg /p:AssemblyVersion=1.0.0.0 /p:Version=${VERSION}

      - name: Push
        if: github.ref_type == 'tag' && !inputs.dry_run
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "**/LinQL*.$VERSION.nupkg" -s https://api.nuget.org/v3/index.json -k "$NUGET_API_KEY"

      # Mirrors docs/ to the wiki. The .wiki.git repository only exists once the
      # wiki has at least one page, so this assumes it has been initialised.
      - name: Sync Wiki
        if: github.ref_type == 'tag' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MAIL: 11923585+dibble-james@users.noreply.github.com
          GH_NAME: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          git config --global user.name "$GH_NAME"
          git config --global user.email "$GH_MAIL"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          rsync -a --delete --exclude '.git' docs/ wiki/
          git -C wiki add -A
          if git -C wiki diff --cached --quiet; then
            echo "Wiki is already up to date."
          else
            git -C wiki commit -m "Sync wiki from ${GITHUB_SHA}"
            git -C wiki push
          fi
