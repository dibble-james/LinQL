name: Nuget

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Skip the NuGet push and the wiki sync
        type: boolean
        default: false
  push:
    branches: [main]
    tags: "*"
  pull_request:
    branches: [main]

# The wiki sync pushes to <repo>.wiki.git, which needs contents: write.
# id-token: write lets the publish steps request a GitHub OIDC token, which
# nuget.org exchanges for a short-lived API key (trusted publishing).
# Pull requests from forks are downgraded to read-only by GitHub regardless.
permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The tag name for a tag push (the release version), 1.0.0 otherwise.
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '1.0.0' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # global.json pins the SDK, and that pin is what actually selects it:
          # without one the resolver picks the highest SDK on the runner.
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      # The formatter has to run after a build. On a clean checkout dotnet format
      # loads the workspace before the source generator has been compiled, so the
      # generated types look missing and every using that names them is flagged.
      - name: Build
        run: dotnet build --no-restore

      # Whitespace, code style and analyzers. C# sources are LF on every platform
      # (.editorconfig and .gitattributes agree), so this passes on the Linux runner too.
      - name: Verify formatting
        run: dotnet format LinQL.slnx --no-restore --verify-no-changes

      - name: Run Tests
        run: dotnet test --no-restore

      - name: Pack
        run: dotnet pack --no-restore -c release --include-symbols /p:SymbolPackageFormat=snupkg /p:AssemblyVersion=1.0.0.0 /p:Version=${VERSION}

      # Builds a consumer against the packed artifacts so the generator is
      # exercised from analyzers/dotnet/cs, not from a project reference.
      - name: Smoke test packed analyzers
        run: ./eng/smoke-test-package.sh

      # Trusted publishing: no long-lived NuGet API key is stored. The OIDC token
      # is checked against the nuget.org policy for owner dibble-james, repo
      # LinQL and this workflow file (nuget.yml), then traded for a key that is
      # valid for one hour — so it is requested immediately before the push.
      - name: NuGet login (OIDC -> temporary API key)
        if: github.ref_type == 'tag' && !inputs.dry_run
        id: login
        uses: NuGet/login@v1
        with:
          # The nuget.org profile name, not an email address.
          user: ${{ secrets.NUGET_USER }}

      # --skip-duplicate keeps a re-run of the same tag green: the packages are
      # already on nuget.org and there is nothing left to do for them.
      - name: Push
        if: github.ref_type == 'tag' && !inputs.dry_run
        run: dotnet nuget push "**/LinQL*.$VERSION.nupkg" -s https://api.nuget.org/v3/index.json -k "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate

      # Pack writes these alongside the .nupkg (/p:SymbolPackageFormat=snupkg).
      # nuget.org only accepts symbols for a version it already has, so this
      # runs after the push above.
      - name: Push symbols
        if: github.ref_type == 'tag' && !inputs.dry_run
        run: dotnet nuget push "**/LinQL*.$VERSION.snupkg" -s https://api.nuget.org/v3/index.json -k "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate

      # Mirrors docs/ to the wiki, rewriting in-source links so they resolve on
      # the wiki too. strategy: clone (the default) adds a commit rather than
      # force-pushing, and the .wiki.git repository only exists once the wiki has
      # at least one page, so this assumes it has been initialised.
      - name: Sync Wiki
        if: github.ref_type == 'tag' && !inputs.dry_run
        uses: Andrew-Chen-Wang/github-wiki-action@v5
        with:
          path: docs
          # No commit on a tag whose docs are unchanged.
          disable-empty-commits: true
